name: CI

# Version 1.0.5 Workstream B — see PRODUCT_ROADMAP.md and
# TECHNICAL_DECISION_RECORDS.md for the reasoning. Scope, deliberately:
# lint + typecheck + unit tests + build, matching the original
# Workstream B description exactly. Integration tests are NOT run here
# yet — they need real staging Supabase/Sheets credentials as GitHub
# Actions secrets, which is a security-sensitive setup step requiring
# your explicit decision (see the Workstream B completion report), not
# something bundled into this first CI pass.

"on":
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Static-generated routes (Portfolio/Journal/Workshops/Services
      # detail pages, generateStaticParams) fetch real content from
      # Sanity at build time (src/sanity/lib/client.ts) — both datasets
      # require a token even for reads. Without these secrets set in
      # the repo (Settings -> Secrets and variables -> Actions), this
      # step will either fail or silently build with zero pre-rendered
      # entries for those routes, per that file's own documented
      # behavior. NEXT_PUBLIC_SANITY_PROJECT_ID/DATASET aren't
      # confidential (they ship to every browser already) but are
      # still read from secrets here for one reason: to keep this
      # workflow file identical regardless of which project/dataset
      # values are current, rather than hardcoding them somewhere a
      # future project/dataset change could miss.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_VERSION: ${{ secrets.SANITY_API_VERSION }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SITE_ENV: staging
