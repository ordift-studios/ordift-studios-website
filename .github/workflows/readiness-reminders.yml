name: Readiness reminders scheduler

# Hourly trigger for the readiness-reminder check (B2). It only CALLS the app's endpoint; what the endpoint does is
# controlled inside the app by the Reminders mode (Off / Dry run / Test / Live), which is Off by default. The endpoint is
# idempotent and single-flight, so a delayed, duplicated or retried trigger cannot double-send.
#
# Notes:
#  * GitHub may delay or drop scheduled runs under load, and only runs the default branch. The app records a heartbeat
#    for every run and raises an Overview alarm if none succeeds within the configured window; a daily Vercel sweep
#    (vercel.json) and the admin "Run check now" button are independent fallbacks.
#  * In a public repository GitHub disables scheduled workflows after 60 days without repository activity.
#  * INERT UNTIL ENABLED: the job only runs when the repository variable READINESS_SCHEDULER_ENABLED is exactly "true".
#    Merging this file therefore starts nothing by itself.
#  * Required (set by the repository owner; values are never printed here): secret READINESS_SCHEDULER_SECRET (the same
#    value as the app's READINESS_SCHEDULER_SECRET in Vercel Production; independent of CRON_SECRET, which Pulse uses) and variable READINESS_SCHEDULER_URL (the full https URL of /api/cron/readiness-reminders).

on:
  schedule:
    - cron: "17 * * * *" # hourly, deliberately off the top of the hour when GitHub is busiest
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: readiness-reminders
  cancel-in-progress: false

jobs:
  trigger:
    if: ${{ vars.READINESS_SCHEDULER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminder endpoint
        env:
          READINESS_SCHEDULER_SECRET: ${{ secrets.READINESS_SCHEDULER_SECRET }}
          TARGET_URL: ${{ vars.READINESS_SCHEDULER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${READINESS_SCHEDULER_SECRET:-}" ] || [ -z "${TARGET_URL:-}" ]; then
            echo "::error::The scheduler secret or URL is not configured."
            exit 1
          fi
          case "$TARGET_URL" in
            https://*) ;;
            *) echo "::error::The scheduler URL must start with https://"; exit 1 ;;
          esac
          code=$(curl --silent --show-error --max-time 60 --retry 2 --retry-delay 10 --retry-all-errors \
            --output response.json --write-out '%{http_code}' --request POST \
            --header "Authorization: Bearer ${READINESS_SCHEDULER_SECRET}" --header "x-scheduler-trigger: github" "$TARGET_URL")
          echo "HTTP ${code}"
          cat response.json
          echo
          [ "$code" = "200" ]
